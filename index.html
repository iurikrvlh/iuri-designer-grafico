<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Iuri Carvalho — designer gráfico. Conheça meu trabalho, serviços e formas de contato."
    />
    <meta name="theme-color" content="#0e0f0e" />
    <title>Iuri Carvalho — Designer gráfico</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header class="site-header">
      <a class="wordmark" href="#inicio" aria-label="Iuri Carvalho, início">
        <span class="wordmark__name">iuri carvalho</span>
        <span class="wordmark__role">designer gráfico</span>
      </a>

      <nav class="site-nav" aria-label="Navegação principal">
        <a href="#portfolio">Portfólio</a>
        <a href="#servicos">Serviços</a>
        <a href="#contato">Contato</a>
      </nav>
    </header>

    <main id="inicio" class="hero">
      <div class="hero-layout">
        <img
          class="hero-gif"
          src="./assets/logo.gif"
          alt="Animação da identidade visual de Iuri Carvalho"
        />

        <section class="hero-copy" aria-label="Apresentação">
          <h1 class="hero-copy__greeting">
            H<span class="hero-copy__greeting-accent">i!</span>
          </h1>

          <p class="hero-copy__text">
            Me chamo <span class="hero-copy__green">iuri,</span> adoro gatos e sou o seu
            <span class="hero-copy__blue">designer gráfico.</span>
          </p>
        </section>
      </div>
    </main>
  </body>
</html>
